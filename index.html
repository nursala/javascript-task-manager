<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    >
    <title>Nour-Amer</title>
</head>
<body>
<div class="container py-4">

    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-2 mb-md-0">Task Manager</h1>
        <button id="addTaskButton" class="btn btn-primary">+ New Task</button>
    </div>

    <!-- Filters Card -->
    <div class="card mb-4">
        <div class="card-body">
            <form class="row gy-3 gx-3 align-items-center" id="filtersForm">
                <!-- Category filter -->
                <div class="col-12 col-md-6">
                    <label for="categoryFilter" class="form-label mb-1">Filter by category</label>
                    <select class="form-select" id="categoryFilter">
                        <option value="">All categories</option>
                    </select>
                </div>

                <!-- Sort filter -->
                <div class="col-12 col-md-6">
                    <label for="sortByDateFilter" class="form-label mb-1">Sort by</label>
                    <select class="form-select" id="sortByDateFilter">
                        <option value="asc">Earliest first</option>
                        <option value="desc">Latest first</option>
                    </select>
                </div>
            </form>
        </div>
    </div>

    <div id="tasksContainer">

    </div>

    <!-- New Task Modal -->
    <div class="modal fade" id="taskModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title" id="modalTitle">New Task</h4>
                    <button type="button" class="btn-close" id="headerCloseBtn" aria-label="Close"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body">
                    <form id="taskForm" novalidate>

                        <!-- Task Name -->
                        <div class="mb-3">
                            <label for="taskName" class="form-label">Task Name</label>
                            <input id="taskName" type="text" class="form-control">
                            <div id="taskNameError" class="text-danger small mt-1"></div>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label for="taskCategory" class="form-label">Category</label>
                            <select class="form-select" id="taskCategory"></select>
                            <div id="taskCategoryError" class="text-danger small mt-1"></div>
                        </div>

                        <!-- Priority -->
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <div id="priorityContainer"></div>
                            <div id="priorityError" class="text-danger small mt-1"></div>
                        </div>


                        <!-- Due Date -->
                        <div class="mb-3">
                            <label for="dueDate" class="form-label">Due Date</label>
                            <input type="datetime-local" id="dueDate" class="form-control">
                            <div id="dueDateError" class="text-danger small mt-1"></div>

                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="taskDescription" class="form-label">Description (Optional)</label>
                            <textarea
                                    id="taskDescription"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Write details about the task..."
                            ></textarea>
                            <div id="taskDescriptionError" class="text-danger small mt-1"></div>
                        </div>

                    </form>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="closeButton">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveButton">Save</button>
                </div>

            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="TaskValidator.js"></script>
<script src="app.js"></script>

</body>
</html>
